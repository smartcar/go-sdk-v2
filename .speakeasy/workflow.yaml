workflowVersion: 1.0.0
sources:
    my-source:
        inputs:
            - location: https://raw.githubusercontent.com/smartcar/api-schema/master/speakeasy/openapi.yaml
              authHeader: Authorization
              authSecret: $openapi_doc_auth_token
targets:
    smartcar-go-v2:
        target: go
        source: my-source
